name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and build
        run: |
          flutter create --org com.yourname --project-name event_reminder app
          cp -r lib app/
          cp patch.py app/
          cd app
          flutter pub add flutter_local_notifications:^17.2.4 timezone shared_preferences url_launcher
          python3 patch.py
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: event-reminder-apk
          path: app/build/app/outputs/flutter-apk/*.apk
